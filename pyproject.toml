[project]
name = "runpod-serverless"
version = "0.1.0"
description = "Runpod serverless application for a coding assignment running an image generation LLM."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "diffusers==0.42.0",
    "runpod==1.12.0",
    "sentencepiece==0.2.2",
    "torch==2.14.1",
    "transformers==5.20.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "rust-just==1.59.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The worker modules sit at the repo root rather than in a package
pythonpath = ["."]
